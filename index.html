    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme') || localStorage.getItem('brandbattle_theme');
          var isLight = stored === 'light' || (stored === 'system' && window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isLight) {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          }

          // Clean up any stale sessions or unwanted known accounts from previous versions
          localStorage.removeItem('brandbattle_known_accounts');
          var existing = localStorage.getItem('brandbattle_local_user');
          if (existing && (existing.indexOf('khairnarvaishali716') !== -1 || existing.indexOf('cgn@123') !== -1 || existing.indexOf('fhz') !== -1)) {
            localStorage.removeItem('brandbattle_local_user');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Identity Services for native Google account selection on system -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
